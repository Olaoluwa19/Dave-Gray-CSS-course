<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="author" content="Oluwadurotimi Oladapo" />
  <meta name="description" content="Contact information for The Little Taco Shop" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Little Tacos Shop</title>
  <link rel="stylesheet" href="css/main.css" type="text/css" />
  <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
</head>

<body>
  <header class="header">
    <h1 class="header__h1">Little Taco Shop</h1>
    <nav class="header__nav" aria-label="Primary-Navigation">
      <ul class="header__ul">
        <li>
          <a href="index.html">Home</a>
        </li>
        <li>
          <a href="index.html#menu">Menu</a>
        </li>
        <li>
          <a href="hours.html">Hours</a>
        </li>
        <li>
          <a href="about.html">About</a>
        </li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <figure>
      <img src="img/tacos__3__1000x620.jpg" alt="Tacos and a Drink" title="Tacos ready to eat!" width="1000"
        height="620" />
      <figcaption class="offscreen">Little Taco Shop Tacos</figcaption>
    </figure>
  </section>

  <main>
    <article id="location" class="main__article">
      <h2>Our Location</h2>
      <address>
        555 Taco Temptation Lane, Suite T <br />
        Kansas City, MO 55555-555
        <p>
          Phone:
          <a href="tel:555-555-5555">555-555-5555</a>
        </p>
      </address>
    </article>

    <article id="contact" class="main__article contact">
      <h2 class="contact__h2">Our Contact Form</h2>
      <form action="https://httpbin.org/get" method="get" class="contact__form">
        <fieldset class="contact__fieldset">
          <legend class="offscreen">Send Us a Message</legend>
          <p class="contact__p">
            <label class="contact__label" for="name">Name:</label>
            <input class="contact__input" type="text" name="name" id="name" autocomplete="on" required
              placeholder="your name" />
          </p>
          <p class="contact__p">
            <label class="contact__label" for="email">Email:</label>
            <input class="contact__input" type="email" name="email" id="email" placeholder="your email" required
              autocomplete="on" />
          </p>
          <p class="contact__p">
            <label class="contact__label" for="message">Your Message:</label>
            <br />
            <textarea class="contact__textarea" name="message" id="message" cols="30" rows="10"
              placeholder="type your message here"></textarea>
          </p>
        </fieldset>

        <button class="contact__button" type="submit">Submit</button>
        <button class="contact__button" type="reset">Reset</button>
      </form>
    </article>
    <p>
      <a href="#">Back to Top</a>
    </p>
  </main>

  <footer class="footer">
    <p>
      <span class="nowrap">Copyright &copy;<time id="year"></time></span>
      <span class="nowrap">Little Taco Shop</span>
    </p>
  </footer>
</body>

</html>
