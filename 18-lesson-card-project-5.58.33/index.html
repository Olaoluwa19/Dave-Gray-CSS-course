<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Mini-Project: Profile Cards</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Our Staff</h1>
      <nav>
        <a href="#profile1">Juliet</a>
        <a href="#profile2">Matt</a>
        <a href="#profile3">Jane</a>
      </nav>
    </header>

    <main>
      <article id="profile1" class="card">
        <figure>
          <img
            src="img/profile-pic-3-500x421.png"
            alt="Juliet Sexy"
            width="500"
            height="421"
          />
          <figcaption>Juliet Sexy</figcaption>
        </figure>
        <p><q>I am Hot</q></p>
      </article>

      <article id="profile2" class="card">
        <figure>
          <img
            src="img/profile-pic-2-500x445.png"
            alt="Matt Designer"
            width="500"
            height="445"
          />
          <figcaption>Matt Designer</figcaption>
        </figure>
        <p><q>I design stuff</q></p>
      </article>

      <article id="profile3" class="card">
        <figure>
          <img
            src="img/profile-pic-1-500x470.png"
            alt="Jane Dev Rel"
            width="500"
            height="470"
          />
          <figcaption>Jane <span>Dev Rel</span></figcaption>
        </figure>
        <p><q>I teach stuff</q></p>
      </article>
    </main>

    <footer>&copy; Acme Co.</footer>
  </body>
</html>
